{% extends "base.html" %}
{% import "_table.html" as t %}
{% block title %}F2.1 Search books{% endblock %}
{% block content %}
  <h1>F2.1 Search books</h1>
  <form method="get" action="/search">
    <label>Title keyword
      <input type="text" name="title" value="{{ form.title }}">
    </label>
    <label>Min price
      <input type="number" step="0.01" name="min_price" value="{{ form.min_price }}">
    </label>
    <label>Max price
      <input type="number" step="0.01" name="max_price" value="{{ form.max_price }}">
    </label>
    <label>Category
      <select name="category_id">
        <option value="">All categories</option>
        {% for cid, cname in categories %}
          <option value="{{ cid }}" {% if form.category_id == cid|string %}selected{% endif %}>{{ cname }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Search</button>
  </form>
  {{ t.show(result) }}
{% endblock %}
