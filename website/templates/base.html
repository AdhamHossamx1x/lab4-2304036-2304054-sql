<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Library{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f6fa; color: #222; }
    nav { background: #1f3a93; padding: 12px 20px; }
    nav a { color: #fff; margin-right: 16px; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    table { border-collapse: collapse; width: 100%; background: #fff; margin-bottom: 24px; }
    th, td { border: 1px solid #ccd; padding: 8px 10px; text-align: left; }
    th { background: #e8ecf8; }
    .error { background: #fde8e8; color: #a00; padding: 10px; border-radius: 4px; }
    .empty { color: #777; font-style: italic; }
    form { background: #fff; padding: 16px; border-radius: 4px; margin-bottom: 24px; }
    label { display: inline-block; margin: 6px 12px 6px 0; }
    input, select { padding: 6px; }
    button { padding: 7px 16px; background: #1f3a93; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/search">F2.1 Search</a>
    <a href="/catalogue">F2.2 Catalogue</a>
    <a href="/reports">F2.3 Reports</a>
    <a href="/loans">F2.4 Loans</a>
    <a href="/most-borrowed">F2.5 Most borrowed</a>
    <a href="/authors">F2.6 Authors</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
